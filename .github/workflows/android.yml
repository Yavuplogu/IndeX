name: Verification Android Lot 6D
on:
  # APK diagnostic ou release Android : construction à la demande uniquement.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Type d’APK (release exige les secrets de signature)'
        type: choice
        default: diagnostic
        options:
          - diagnostic
          - release
permissions:
  contents: write
# Même verrou que Windows : le compteur est commun aux deux plateformes.
concurrency:
  group: index-windows-version-counter
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Réserver la version Android dans le compteur partagé
        run: python tools/versioning/reserve.py --ci
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Vérifier les publications privées sans écrasement
        run: bash tools/lot6/test_private_moves.sh
      - name: Vérifier les reprises après interruption audio
        run: bash tools/lot6/test_audio_interruptions.sh
      # Clé de diagnostic uniquement, pour conserver les profils entre APK de test.
      # La clé de distribution est indépendante et fournie seulement au mode release.
      - name: Réutiliser la signature de diagnostic Android
        if: inputs.mode == 'diagnostic'
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: index-android-diagnostic-signing-v1
      - uses: android-actions/setup-android@v4
        with:
          # Le paquet historique "tools" n’existe plus dans le dépôt SDK.
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: SDK Android 36 et NDK épinglé
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Préparer les dépendances verrouillées avant les contrôles hors ligne
        run: |
          dart pub get --enforce-lockfile
          cd apps/index_windows
          flutter pub get --enforce-lockfile
      - name: Contrôles du coeur et de l'interface
        run: bash tools/lot4/check.sh
      - name: Contrôles de distribution Android
        run: python -m unittest discover -s tools/lot6 -p 'test_*.py'
      - name: APK de test ARM64 (catalogue seul, aucun MP3)
        if: inputs.mode == 'diagnostic'
        run: bash tools/lot5/build_android.sh
      - name: Préparer le diagnostic versionné
        if: inputs.mode == 'diagnostic'
        run: |
          mkdir -p dist
          cp apps/index_windows/build/app/outputs/flutter-apk/app-debug.apk "dist/IndeX_${INDEX_VERSION}_android_arm64_diagnostic.apk"
          cp docs/lot6/RECETTE_ANDROID.md dist/LISEZ-MOI_ANDROID.md
          python tools/lot6/inspect_apk.py "dist/IndeX_${INDEX_VERSION}_android_arm64_diagnostic.apk" > dist/diagnostic-apk.json
          cd dist
          sha256sum *.apk > "IndeX_${INDEX_VERSION}_android_arm64_diagnostic.apk.sha256"
      - name: Préparer et construire la release signée
        if: inputs.mode == 'release'
        env:
          INDEX_ANDROID_KEYSTORE_BASE64: ${{ secrets.INDEX_ANDROID_KEYSTORE_BASE64 }}
          INDEX_ANDROID_STORE_PASSWORD: ${{ secrets.INDEX_ANDROID_STORE_PASSWORD }}
          INDEX_ANDROID_KEY_ALIAS: ${{ secrets.INDEX_ANDROID_KEY_ALIAS }}
          INDEX_ANDROID_KEY_PASSWORD: ${{ secrets.INDEX_ANDROID_KEY_PASSWORD }}
          INDEX_ANDROID_CERT_SHA256: ${{ vars.INDEX_ANDROID_CERT_SHA256 }}
        run: |
          python tools/lot6/prepare_signing.py
          export INDEX_ANDROID_KEYSTORE="$RUNNER_TEMP/index-release-signing.jks"
          bash tools/lot6/build_release.sh
          mkdir -p dist
          cp apps/index_windows/build/app/outputs/flutter-apk/app-release.apk "dist/IndeX_${INDEX_VERSION}_android_arm64_release.apk"
          python tools/lot6/inspect_apk.py "dist/IndeX_${INDEX_VERSION}_android_arm64_release.apk" \
            --release --sdk-tools "$ANDROID_HOME/build-tools/36.0.0" \
            --certificate-sha256 "$INDEX_ANDROID_CERT_SHA256" \
            --build-name "$INDEX_BUILD_NAME" --build-number "$INDEX_BUILD_NUMBER" > dist/release-apk.json
          cp docs/lot6/DISTRIBUTION_ANDROID.md dist/LISEZ-MOI_ANDROID.md
          cp docs/lot6/RECETTE_6D.md dist/RECETTE_6D.md
          cp docs/lot6/NOTES_ANDROID.md dist/NOTES_ANDROID.md
          # Garder les guides liés consultables dans l’artefact décompressé.
          cp docs/lot6/DISTRIBUTION_ANDROID.md docs/lot6/SIGNATURE_ANDROID_DEPUIS_WINDOWS.md docs/lot6/RECETTE_ANDROID.md docs/lot6/bilan-6D.md dist/
          cd dist
          sha256sum *.apk > "IndeX_${INDEX_VERSION}_android_arm64_release.apk.sha256"
      - name: Notices et provenance de la construction
        env:
          INDEX_ANDROID_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PYTHON'
          import gzip, json, os, pathlib, zipfile
          dist = pathlib.Path('dist')
          import shutil
          shutil.copyfile('LICENSE', dist / 'LICENSE')
          shutil.copyfile('LICENSE_SCOPE.md', dist / 'LICENSE_SCOPE.md')
          apks = list(dist.glob('*.apk'))
          assert len(apks) == 1, 'Un seul APK attendu par artefact'
          with zipfile.ZipFile(apks[0]) as archive:
              (dist / 'NOTICES.txt').write_bytes(gzip.decompress(archive.read('assets/flutter_assets/NOTICES.Z')))
              (dist / 'LICENSE-octicons.txt').write_bytes(archive.read('assets/flutter_assets/assets/icons/LICENSE-octicons.txt'))
          report = {key: os.environ[key] for key in ['INDEX_VERSION', 'INDEX_BUILD_NAME', 'INDEX_BUILD_NUMBER', 'INDEX_ANDROID_MODE', 'INDEX_SOURCE_COMMIT', 'INDEX_COUNTER_COMMIT', 'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT']}
          (dist / 'build-info.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          PYTHON
      - name: Retirer la clé du runner
        if: always() && inputs.mode == 'release'
        run: rm -f "$RUNNER_TEMP/index-release-signing.jks"
      - uses: actions/upload-artifact@v6
        with:
          name: IndeX-${{ env.INDEX_VERSION }}-Android-arm64-${{ inputs.mode == 'diagnostic' && 'test' || 'release' }}
          path: dist/*
          if-no-files-found: error
