name: Verification Android Lot 5
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: SDK Android 36 et NDK épinglé
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Contrôles du coeur et de l'interface
        run: bash tools/lot4/check.sh
      - name: APK de test ARM64 (catalogue seul, aucun MP3)
        run: bash tools/lot5/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: IndeX-Android-arm64-test
          path: apps/index_windows/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
