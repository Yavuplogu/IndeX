name: Verification Android Lot 6A
on:
  # APK de diagnostic Android : construction à la demande uniquement.
  workflow_dispatch:
permissions:
  contents: write
# Même verrou que Windows : le compteur est commun aux deux plateformes.
concurrency:
  group: index-windows-version-counter
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Réserver la version de diagnostic dans le compteur partagé
        run: python tools/versioning/reserve.py --ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # Le paquet historique "tools" n’existe plus dans le dépôt SDK.
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: SDK Android 36 et NDK épinglé
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Contrôles du coeur et de l'interface
        run: bash tools/lot4/check.sh
      - name: APK de test ARM64 (catalogue seul, aucun MP3)
        run: bash tools/lot5/build_android.sh
      - name: Préparer le diagnostic versionné
        run: |
          mkdir -p dist
          cp apps/index_windows/build/app/outputs/flutter-apk/app-debug.apk "dist/IndeX_${INDEX_VERSION}_android_arm64_diagnostic.apk"
          cp docs/lot6/RECETTE_ANDROID.md dist/LISEZ-MOI_ANDROID.md
          python tools/lot6/inspect_apk.py "dist/IndeX_${INDEX_VERSION}_android_arm64_diagnostic.apk" > dist/diagnostic-apk.json
          cd dist
          sha256sum *.apk > "IndeX_${INDEX_VERSION}_android_arm64_diagnostic.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: IndeX-${{ env.INDEX_VERSION }}-Android-arm64-test
          path: dist/*
          if-no-files-found: error
