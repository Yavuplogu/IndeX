name: Construction Windows portable (réutilisable)
on:
  workflow_call:
    inputs:
      version:
        description: 'Version publique réservée par le workflow commun'
        required: true
        type: string
      build_name:
        required: true
        type: string
      build_number:
        required: true
        type: string
      source_commit:
        description: 'Commit source immuable commun aux deux plateformes'
        required: true
        type: string
      counter_commit:
        required: true
        type: string
# Version réservée une seule fois par build.yml. Aucun verrou imbriqué.
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      INDEX_VERSION: ${{ inputs.version }}
      INDEX_BUILD_NAME: ${{ inputs.build_name }}
      INDEX_BUILD_NUMBER: ${{ inputs.build_number }}
      INDEX_SOURCE_COMMIT: ${{ inputs.source_commit }}
      INDEX_COUNTER_COMMIT: ${{ inputs.counter_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tester le runtime, la disposition portable et les codes de sortie
        shell: pwsh
        run: |
          ./tools/lot4/test_runtime_windows.ps1
          ./tools/lot4/test_portable_windows.ps1
          ./tools/lot4/test_process_windows.ps1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Tests du coeur, widgets et recette native Windows
        shell: pwsh
        run: ./tools/lot4/check.ps1
      - name: Construction de l'archive portable sans MP3
        shell: pwsh
        run: ./tools/lot4/package_windows.ps1
      - name: Lancement de l'archive extraite
        shell: pwsh
        run: ./tools/lot4/smoke_archive.ps1 -Archive "./dist/IndeX_$($env:INDEX_VERSION)_windows_x64_portable.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: IndeX-${{ env.INDEX_VERSION }}-windows-x64-portable
          overwrite: true
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: IndeX-windows-diagnostics
          overwrite: true
          path: dist/diagnostics-smoke/*
          if-no-files-found: ignore
