name: Verification Windows portable
on:
  push:
    branches-ignore: [index-build-versions]
  pull_request:
  workflow_dispatch:
# La branche de compteurs ne contient aucune donnée utilisateur ni code applicatif.
permissions:
  contents: write
concurrency:
  group: index-windows-version-counter
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Réserver la version du build (y compris en cas d'échec ultérieur)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          python tools/versioning/reserve.py --ci
          if ($LASTEXITCODE -ne 0) { throw 'Réservation de version échouée.' }
      - name: Tester le runtime, la disposition portable et les codes de sortie
        shell: pwsh
        run: |
          ./tools/lot4/test_runtime_windows.ps1
          ./tools/lot4/test_portable_windows.ps1
          ./tools/lot4/test_process_windows.ps1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Tests du coeur, widgets et recette native Windows
        shell: pwsh
        run: ./tools/lot4/check.ps1
      - name: Construction de l'archive portable sans MP3
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./tools/lot4/package_windows.ps1
      - name: Lancement de l'archive extraite
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./tools/lot4/smoke_archive.ps1 -Archive "./dist/IndeX_$($env:INDEX_VERSION)_windows_x64_portable.zip"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: IndeX-${{ env.INDEX_VERSION }}-windows-x64-portable
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IndeX-windows-diagnostics
          path: dist/diagnostics-smoke/*
          if-no-files-found: ignore
