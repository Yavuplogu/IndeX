name: index_windows
description: IndeX portable Windows — catalogue documentaire hors ligne.
publish_to: none
version: 0.4.0+1
environment:
  sdk: '>=3.13.5 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  index_core:
    path: ../..
  file_selector: 1.1.0
  window_manager: 0.5.2
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/catalogue.sqlite
    - assets/catalogue.sqlite.manifest.json
