name: index_windows
description: IndeX portable Windows — catalogue documentaire hors ligne.
publish_to: none
version: 0.5.1+1
environment:
  sdk: '>=3.13.5 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  index_core:
    path: ../..
  file_selector: 1.1.0
  window_manager: 0.5.2
  just_audio: 0.10.6
  just_audio_windows:
    path: ../../third_party/just_audio_windows
  # Évite JNI transitif sur Windows ; version compatible avec path_provider 2.1.6.
  path_provider_android: 2.2.23
dev_dependencies:
  just_audio_platform_interface: 4.6.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/catalogue.sqlite
    - assets/catalogue.sqlite.manifest.json
